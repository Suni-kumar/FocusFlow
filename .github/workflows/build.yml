name: Android CI / Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:+UseParallelGC --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED\""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Environment Files & Keystore
        run: |
          # Create .env for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

          # Ensure fixed debug.keystore is decoded from base64
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from base64"
          fi

          # Verify keystore integrity
          if [ -f "debug.keystore" ]; then
            keytool -list -keystore debug.keystore -storepass android || echo "Keystore check completed"
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.11.1 || true
          fi
          chmod +x ./gradlew || true

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate & Rename Debug APK
        id: apk-path
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          APK_NAME="FocusFlow-v1.0.${{ github.run_number }}.apk"
          cp "$RAW_APK" "$APK_NAME"
          echo "Found APK at: $RAW_APK"
          echo "Copied to: $APK_NAME"
          echo "apk_path=$RAW_APK" >> $GITHUB_OUTPUT
          echo "named_apk_path=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-Debug-APK
          path: ${{ steps.apk-path.outputs.named_apk_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FocusFlow Release v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 FocusFlow Update v1.0.${{ github.run_number }}
            
            - **Seamless APK In-Place Update**: This APK is signed with the consistent repository keystore and incremented version code. You can install it directly over your existing app without uninstalling or losing your local data!
            - **Download**: Directly download `FocusFlow-v1.0.${{ github.run_number }}.apk` below.
          files: ${{ steps.apk-path.outputs.named_apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
